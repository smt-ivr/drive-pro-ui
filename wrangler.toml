name = "drive-pro-ui"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Served at https://smti.uk/drive-pro/* (route is configured in the Cloudflare dashboard).
# The API worker ("drive-pro") owns the more specific /drive-pro/api/* route.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
